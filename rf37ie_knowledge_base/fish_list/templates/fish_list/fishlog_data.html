{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои фишлоги</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 95%;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin: 0;
        }

        .nav-link {
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
        }

        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .filters-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        .filter-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-group select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .filter-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-apply {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-apply:hover {
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: auto;
            max-height: calc(100vh - 400px);
        }

        table {
            border-collapse: collapse;
            font-size: 14px;
            width: 100%;
            min-width: 800px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #5a67d8;
            white-space: nowrap;
            font-size: 14px;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46a0 100%);
        }

        th .sort-icon {
            margin-left: 5px;
            font-size: 12px;
            opacity: 0.7;
        }

        th .sort-icon.active {
            opacity: 1;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
            white-space: nowrap;
            color: #333;
        }

        tr:hover {
            background-color: #f0f0ff;
        }

        tr:nth-child(even) {
            background-color: #fafafa;
        }

        tr:nth-child(even):hover {
            background-color: #f0f0ff;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #999;
        }

        .error {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #dc3545;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #999;
        }

        .pagination {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .pagination-info {
            color: #666;
            font-size: 14px;
        }

        .pagination-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pagination-buttons button {
            padding: 8px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }

        .pagination-buttons button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .pagination-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-indicator {
            padding: 8px 15px;
            background: #f0f0ff;
            border-radius: 6px;
            font-weight: 600;
            color: #667eea;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46a0 100%);
        }

        .row-trophy {
            color: #28a745 !important;
            font-weight: 600;
        }

        .row-valuable {
            color: #dc3545 !important;
            font-weight: 600;
        }

        .row-regular {
            color: #333;
        }

        .row-trophy td, .row-valuable td, .row-regular td {
            color: inherit;
        }

        tr.row-trophy:hover {
            background-color: #d4edda !important;
        }

        tr.row-valuable:hover {
            background-color: #f8d7da !important;
        }

        tr.row-trophy:nth-child(even) {
            background-color: #e8f5e9;
        }

        tr.row-valuable:nth-child(even) {
            background-color: #fdf2f2;
        }

        .stats-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: none;
        }

        .stats-section.visible {
            display: block;
        }

        .stats-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
        }

        .stats-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
        }

        .stats-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }

        .stats-table tr:hover {
            background-color: #f0f0ff;
        }

        .stats-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .stats-table th:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46a0 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Мои фишлоги</h1>
            <div style="display: flex; gap: 12px;">
                <a href="{% url 'fish_list:fish_list' %}" class="nav-link">🐟 Список рыб</a>
                <a href="{% url 'fish_list:import_fishlog' %}" class="nav-link">📁 Импорт фишлогов</a>
            </div>
        </div>

        <div class="filters-box">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="filter-fish">🐟 Название рыбы</label>
                    <select id="filter-fish" onchange="onFishChange()">
                        <option value="">Все рыбы</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-base">🏠 База</label>
                    <select id="filter-base" onchange="onBaseChange()">
                        <option value="">Все базы</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-location">📍 Локация</label>
                    <select id="filter-location" onchange="onLocationChange()">
                        <option value="">Все локации</option>
                    </select>
                </div>
            </div>

            <div class="filter-buttons">
                <button class="btn-reset" onclick="resetFilters()">🔄 Сбросить</button>
                <button class="btn-apply" onclick="applyFilters()">🔍 Применить</button>
            </div>
        </div>

        <div class="table-container">
            <table id="fishlog-table">
                <thead>
                    <tr>
                        <th data-field="fish_name" onclick="sortTable('fish_name')">Название рыбы<span class="sort-icon"> ↕</span></th>
                        <th data-field="fish_weight" onclick="sortTable('fish_weight')">Вес<span class="sort-icon"> ↕</span></th>
                        <th data-field="bait_name" onclick="sortTable('bait_name')">Наживка<span class="sort-icon"> ↕</span></th>
                        <th data-field="base_name" onclick="sortTable('base_name')">База<span class="sort-icon"> ↕</span></th>
                        <th data-field="location_name" onclick="sortTable('location_name')">Локация<span class="sort-icon"> ↕</span></th>
                        <th data-field="time" onclick="sortTable('time')">Время<span class="sort-icon"> ↕</span></th>
                        <th data-field="depth" onclick="sortTable('depth')">Глубина<span class="sort-icon"> ↕</span></th>
                    </tr>
                </thead>
                <tbody id="fishlog-tbody">
                    <tr>
                        <td colspan="7" class="loading">Загрузка данных...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="stats-section" id="stats-section" style="margin-top: 20px;">
            <h2>📊 Статистика по наживкам</h2>
            <div style="overflow-x: auto;">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th data-field="bait_name" onclick="sortStats('bait_name')">Наживка ↕</th>
                            <th data-field="total" onclick="sortStats('total')">Всего ↕</th>
                            <th data-field="regular" onclick="sortStats('regular')">Обычные ↕</th>
                            <th data-field="valuable" onclick="sortStats('valuable')">Зачетные 💎 ↕</th>
                            <th data-field="trophies" onclick="sortStats('trophies')">Трофейные 🏆 ↕</th>
                        </tr>
                    </thead>
                    <tbody id="stats-tbody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let currentSortField = 'id';
        let currentSortOrder = 'desc';
        let currentPage = 1;
        let totalPages = 1;
        let perPage = 1000;

        let allFishNames = [];
        let allBaseNames = [];
        let allLocationNames = [];

        async function loadAllOptions() {
            try {
                const response = await fetch('/api/all-options/');
                const data = await response.json();

                allFishNames = data.all_fish_names;
                allBaseNames = data.all_base_names;
                allLocationNames = data.all_location_names;

                populateDropdown('filter-fish', allFishNames);
                populateDropdown('filter-base', allBaseNames);
                populateDropdown('filter-location', allLocationNames);
            } catch (error) {
                console.error('Error loading options:', error);
            }
        }

        function populateDropdown(elementId, options) {
            const select = document.getElementById(elementId);
            const currentValue = select.value;

            select.innerHTML = '<option value="">Все</option>';

            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.textContent = option;
                select.appendChild(opt);
            });

            if (currentValue && options.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        async function updateDependentDropdowns() {
            const fishName = document.getElementById('filter-fish').value;
            const baseName = document.getElementById('filter-base').value;
            const locationName = document.getElementById('filter-location').value;

            try {
                const params = new URLSearchParams();
                if (fishName) params.append('fish_name', fishName);
                if (baseName) params.append('base_name', baseName);
                if (locationName) params.append('location_name', locationName);

                const response = await fetch(`/api/filter-options/?${params.toString()}`);
                const data = await response.json();

                if (!baseName && !locationName) {
                    populateDropdown('filter-fish', allFishNames);
                } else {
                    populateDropdown('filter-fish', data.fish_names);
                }

                if (!fishName && !locationName) {
                    populateDropdown('filter-base', allBaseNames);
                } else {
                    populateDropdown('filter-base', data.base_names);
                }

                if (!fishName && !baseName) {
                    populateDropdown('filter-location', allLocationNames);
                } else {
                    populateDropdown('filter-location', data.location_names);
                }
            } catch (error) {
                console.error('Error updating dropdowns:', error);
            }
        }

        function onFishChange() {
            updateDependentDropdowns();
        }

        function onBaseChange() {
            updateDependentDropdowns();
        }

        function onLocationChange() {
            updateDependentDropdowns();
        }

        function applyFilters() {
            currentPage = 1;
            loadFishlogData(1);
            loadBaitStatistics();
        }

        function resetFilters() {
            document.getElementById('filter-fish').value = '';
            document.getElementById('filter-base').value = '';
            document.getElementById('filter-location').value = '';

            currentPage = 1;
            loadFishlogData(1);
            loadBaitStatistics();
        }

        async function loadFishlogData(page = 1) {
            const tbody = document.getElementById('fishlog-tbody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Загрузка данных...</td></tr>';

            const fishName = document.getElementById('filter-fish').value;
            const baseName = document.getElementById('filter-base').value;
            const locationName = document.getElementById('filter-location').value;

            try {
                const params = new URLSearchParams({
                    page: page,
                    per_page: perPage,
                    sort: currentSortField,
                    order: currentSortOrder,
                });

                if (fishName) params.append('fish_name', fishName);
                if (baseName) params.append('base_name', baseName);
                if (locationName) params.append('location_name', locationName);

                const response = await fetch(`/api/fishlog-data/?${params.toString()}`);
                const data = await response.json();

                currentPage = data.current_page;
                totalPages = data.total_pages;

                renderTable(data.fishlog_data);
                renderPagination(data);
                updateSortIcons();
            } catch (error) {
                document.getElementById('fishlog-tbody').innerHTML =
                    '<tr><td colspan="7" class="error">❌ Ошибка загрузки данных</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('fishlog-tbody');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="no-data">📋 Нет данных о фишлогах</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(log => {
                // Determine row class based on fish value
                let rowClass = 'row-regular';
                let trophyIcon = '';

                if (log.is_trophy) {
                    rowClass = 'row-trophy';
                    trophyIcon = ' 🏆';
                } else if (log.fish_weight > log.valuable_weight) {
                    rowClass = 'row-valuable';
                    trophyIcon = ' 💎';
                }

                return `
                    <tr class="${rowClass}">
                        <td>${log.fish_name || '-'}${trophyIcon}</td>
                        <td>${log.fish_weight || '-'}</td>
                        <td>${log.bait_name || '-'}</td>
                        <td>${log.base_name || '-'}</td>
                        <td>${log.location_name || '-'}</td>
                        <td>${log.time || '-'}</td>
                        <td>${log.depth || '-'}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination(data) {
            let paginationDiv = document.getElementById('pagination');
            if (!paginationDiv) {
                paginationDiv = document.createElement('div');
                paginationDiv.id = 'pagination';
                paginationDiv.className = 'pagination';
                document.querySelector('.table-container').after(paginationDiv);
            }

            let html = '<div class="pagination-info">';
            html += `Всего записей: ${data.total_records.toLocaleString()} | `;
            html += `Страница ${data.current_page} из ${data.total_pages}`;
            html += '</div>';

            html += '<div class="pagination-buttons">';
            html += `<button onclick="loadFishlogData(1)" ${data.current_page === 1 ? 'disabled' : ''}>⏮️</button>`;
            html += `<button onclick="loadFishlogData(${data.current_page - 1})" ${!data.has_previous ? 'disabled' : ''}>◀️</button>`;
            html += `<span class="page-indicator">${data.current_page} / ${data.total_pages}</span>`;
            html += `<button onclick="loadFishlogData(${data.current_page + 1})" ${!data.has_next ? 'disabled' : ''}>▶️</button>`;
            html += `<button onclick="loadFishlogData(${data.total_pages})" ${data.current_page === data.total_pages ? 'disabled' : ''}>⏭️</button>`;
            html += '</div>';

            paginationDiv.innerHTML = html;
        }

        function sortTable(fieldName) {
            if (currentSortField === fieldName) {
                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortField = fieldName;
                currentSortOrder = 'desc';
            }

            loadFishlogData(1);
        }

        function updateSortIcons() {
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.classList.remove('active');
                icon.textContent = ' ↕';
            });

            const currentHeader = document.querySelector(`th[data-field="${currentSortField}"]`);
            if (currentHeader) {
                const sortIcon = currentHeader.querySelector('.sort-icon');
                sortIcon.classList.add('active');
                sortIcon.textContent = currentSortOrder === 'asc' ? ' ↑' : ' ↓';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadAllOptions();
            loadFishlogData(1);
        });

        async function loadBaitStatistics() {
            const fishName = document.getElementById('filter-fish').value;
            const baseName = document.getElementById('filter-base').value;
            const locationName = document.getElementById('filter-location').value;
            const statsSection = document.getElementById('stats-section');
            const tbody = document.getElementById('stats-tbody');

            if (!fishName) {
                statsSection.classList.remove('visible');
                return;
            }

            statsSection.classList.add('visible');
            tbody.innerHTML = '<tr><td colspan="5" class="loading">Загружаем статистику по наживкам...</td></tr>';

            try {
                const params = new URLSearchParams();
                params.append('fish_name', fishName);
                if (baseName) params.append('base_name', baseName);
                if (locationName) params.append('location_name', locationName);

                const response = await fetch(`/api/bait-statistics/?${params.toString()}`);
                const data = await response.json();

                currentStatsData = data.statistics;
                sortAndRenderStats();
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5" class="error">❌ Ошибка загрузки статистики</td></tr>';
            }
        }

        function renderStatistics(statistics) {
            const tbody = document.getElementById('stats-tbody');

            if (statistics.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-data">Нет данных</td></tr>';
                return;
            }

            tbody.innerHTML = statistics.map(stat => `
                <tr>
                    <td><strong>${stat.bait_name}</strong></td>
                    <td>${stat.total}</td>
                    <td>${stat.regular}</td>
                    <td style="color: #dc3545;">${stat.valuable}</td>
                    <td style="color: #28a745;">${stat.trophies}</td>
                </tr>
            `).join('');
        }

        let statsSortField = 'total';
        let statsSortOrder = 'desc';
        let currentStatsData = [];

        function sortStats(field) {
            if (statsSortField === field) {
                statsSortOrder = statsSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                statsSortField = field;
                statsSortOrder = 'desc';
            }

            sortAndRenderStats();
            updateStatsSortIcons();
        }

        function sortAndRenderStats() {
            const sorted = [...currentStatsData].sort((a, b) => {
                const aVal = a[statsSortField];
                const bVal = b[statsSortField];

                let comparison;
                if (typeof aVal === 'number') {
                    comparison = aVal - bVal;
                } else {
                    comparison = String(aVal).localeCompare(String(bVal), 'ru');
                }

                return statsSortOrder === 'asc' ? comparison : -comparison;
            });

            renderStatistics(sorted);
        }

        function updateStatsSortIcons() {
            // Reset all sort indicators
            document.querySelectorAll('.stats-table th').forEach(th => {
                th.innerHTML = th.innerHTML.replace(/ [↑↓]$/, ' ↕');
            });

            // Update active sort indicator
            const currentHeader = document.querySelector(`.stats-table th[data-field="${statsSortField}"]`);
            if (currentHeader) {
                currentHeader.innerHTML = currentHeader.innerHTML.replace(/ [↕↑↓]$/, '') +
                    (statsSortOrder === 'asc' ? ' ↑' : ' ↓');
            }
        }

        function renderStatistics(statistics) {
            const tbody = document.getElementById('stats-tbody');

            if (statistics.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-data">Нет данных</td></tr>';
                return;
            }

            tbody.innerHTML = statistics.map(stat => `
                <tr>
                    <td><strong>${stat.bait_name}</strong></td>
                    <td>${stat.total}</td>
                    <td>${stat.regular}</td>
                    <td style="color: #dc3545;">${stat.valuable}</td>
                    <td style="color: #28a745;">${stat.trophies}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
